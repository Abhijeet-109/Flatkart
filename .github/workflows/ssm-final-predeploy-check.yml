
name: SSM Final Pre-Deployment Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Verify production files and Git state
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set +e

          REPO="/opt/flatkart/source"

          echo "========== REFRESH GIT REFERENCE =========="
          sudo -u ubuntu git -C "$REPO" fetch origin main

          echo
          echo "========== GIT COMMIT STATE =========="
          sudo -u ubuntu git -C "$REPO" rev-parse HEAD
          sudo -u ubuntu git -C "$REPO" rev-parse origin/main
          sudo -u ubuntu git -C "$REPO" status --short

          echo
          echo "========== MAIN.PY COMPARISON =========="
          EC2_HASH=$(sha256sum "$REPO/backend/main.py" | awk '{print $1}')
          GIT_HASH=$(sudo -u ubuntu git -C "$REPO" show origin/main:backend/main.py | sha256sum | awk '{print $1}')

          echo "EC2 working file SHA256: $EC2_HASH"
          echo "GitHub main file SHA256: $GIT_HASH"

          if [ "$EC2_HASH" = "$GIT_HASH" ]; then
            echo "RESULT: MATCH"
          else
            echo "RESULT: DIFFERENT"
          fi

          echo
          echo "========== UPLOAD CHECKSUM COMPARISON =========="

          HOST_TMP=$(mktemp)
          CONTAINER_TMP=$(mktemp)

          (
            cd /opt/flatkart/persistent/uploads &&
            find . -type f -print0 | sort -z | xargs -0 sha256sum |
            sed 's#  \./#  #'
          ) > "$HOST_TMP"

          docker exec flatkart-backend sh -lc \
            'cd /app/backend/uploads && find . -type f -print0 | sort -z | xargs -0 sha256sum' \
            > "$CONTAINER_TMP"

          if diff -u "$HOST_TMP" "$CONTAINER_TMP"; then
            echo "RESULT: ALL UPLOAD FILE CHECKSUMS MATCH"
          else
            echo "RESULT: UPLOAD DIFFERENCES FOUND"
          fi

          rm -f "$HOST_TMP" "$CONTAINER_TMP"

          echo
          echo "========== MODEL AND CHROMADB GIT TRACKING =========="
          sudo -u ubuntu git -C "$REPO" ls-files backend/model backend/ChromaDB

          echo
          echo "========== MODEL AND CHROMADB CONTAINER INVENTORY =========="
          docker exec flatkart-backend sh -lc \
            'for p in /app/backend/model /app/backend/ChromaDB; do
              echo "--- $p"
              du -sh "$p" 2>/dev/null
              find "$p" -maxdepth 2 -type f -printf "%s %p\n" 2>/dev/null
            done'

          echo
          echo "========== DOCKER BUILD CONFIGURATION =========="
          sed -n '1,100p' "$REPO/backend/Dockerfile"

          for f in "$REPO/.dockerignore" "$REPO/backend/.dockerignore"; do
            if [ -f "$f" ]; then
              echo "--- $f"
              cat "$f"
            fi
          done

          echo
          echo "========== CHECK COMPLETE =========="
          REMOTE
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
