name: SSM Persistence Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Inspect application data paths
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set +e

          echo "========== LOCAL GIT CHANGE SUMMARY =========="
          sudo -u ubuntu git -C /opt/flatkart/source diff --stat
          sudo -u ubuntu git -C /opt/flatkart/source diff --numstat
          sudo -u ubuntu git -C /opt/flatkart/source diff --check

          echo
          echo "========== APPLICATION STORAGE REFERENCES =========="
          grep -RInE \
            'UPLOAD_DIR|UPLOAD_PATH|UPLOAD_FOLDER|manifest\.json|private_return_evidence|ChromaDB|tokenizer\.pkl' \
            /opt/flatkart/source/backend \
            --include='*.py' 2>/dev/null | head -160

          echo
          echo "========== HOST PERSISTENT UPLOADS =========="
          find /opt/flatkart/persistent/uploads -maxdepth 2 \
            -printf '%y %m %u:%g %s %p\n' 2>/dev/null | head -120

          echo
          echo "========== CONTAINER UPLOADS =========="
          docker exec flatkart-backend sh -lc \
            'find /app/backend/uploads -maxdepth 3 -printf "%y %m %u:%g %s %p\n" 2>/dev/null | head -120'

          echo
          echo "========== CONTAINER EVIDENCE STORAGE =========="
          docker exec flatkart-backend sh -lc \
            'find /app/backend/private_return_evidence -maxdepth 3 -printf "%y %m %u:%g %s %p\n" 2>/dev/null | head -120'

          echo
          echo "========== CONTAINER MODEL AND VECTOR DATA =========="
          docker exec flatkart-backend sh -lc \
            'for p in /app/backend/model /app/backend/ChromaDB; do
              echo "--- $p"
              if [ -d "$p" ]; then
                du -sh "$p"
                find "$p" -maxdepth 2 -type f -printf "%s %p\n" | head -80
              else
                echo "Not found"
              fi
            done'

          echo
          echo "========== HOST PERSISTENT DIRECTORY SIZE =========="
          du -sh /opt/flatkart/persistent 2>/dev/null

          echo
          echo "========== CHECK COMPLETE =========="
          REMOTE
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
