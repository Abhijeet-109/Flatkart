name: Flatkart Production Pre-Deploy Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Inspect production environment
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Flatkart read-only pre-deployment audit" \
            --parameters 'commands=[
              "echo === HOST ===",
              "hostname && date -u",
              "echo === SOURCE ===",
              "ls -ld /opt/flatkart/source /opt/flatkart/persistent /var/www/flatkart 2>&1",
              "git -C /opt/flatkart/source rev-parse --short HEAD 2>&1",
              "git -C /opt/flatkart/source status --short 2>&1",
              "echo === FRONTEND BUILD FILES ===",
              "ls -l /opt/flatkart/source/frontend/package.json /opt/flatkart/source/frontend/package-lock.json /opt/flatkart/source/frontend/dist 2>&1",
              "echo === RUNNING CONTAINERS ===",
              "docker ps --format \"table {{.Names}}\\t{{.Image}}\\t{{.Status}}\\t{{.Ports}}\"",
              "echo === DOCKER VOLUMES ===",
              "docker volume ls",
              "echo === BACKEND MOUNTS ===",
              "docker inspect --format \"{{json .Mounts}}\" flatkart-backend 2>&1",
              "echo === DATABASE CONTAINER ===",
              "docker inspect --format \"{{.Name}} {{.Config.Image}} {{.State.Status}}\" flatkart-postgres 2>&1",
              "echo === ENV FILE METADATA ONLY ===",
              "stat -c \"%n permissions=%a owner=%U\" /opt/flatkart/backend.env /opt/flatkart/db.env 2>&1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            case "$STATUS" in
              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM."
          exit 1
