name: Flatkart SSM Connectivity Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Test SSM connectivity
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Flatkart SSM connectivity test" \
            --parameters '{"commands":["whoami","hostname","docker --version"]}' \
            --query "Command.CommandId" \
            --output text)

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "{Status:Status,Output:StandardOutputContent}" \
                --output json
              exit 0
            fi

            case "$STATUS" in
              Failed|TimedOut|Cancelled|Undeliverable|Terminated)
                echo "SSM failed: $STATUS"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM."
          exit 1
