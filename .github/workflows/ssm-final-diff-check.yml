
name: SSM Final Diff Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Inspect production differences
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set +e

          REPO="/opt/flatkart/source"

          echo "========== HOST =========="
          hostname
          date -u

          echo
          echo "========== FETCH LATEST GITHUB MAIN =========="
          sudo -u ubuntu git -C "$REPO" fetch origin main
          echo "Fetch exit code: $?"

          echo
          echo "========== GIT COMMIT REFERENCES =========="
          sudo -u ubuntu git -C "$REPO" rev-parse HEAD
          sudo -u ubuntu git -C "$REPO" rev-parse origin/main

          echo
          echo "========== MAIN.PY: PRODUCTION COMMIT VS GITHUB MAIN =========="
          sudo -u ubuntu git -C "$REPO" diff HEAD..origin/main -- backend/main.py
          echo "Comparison exit code: $?"

          echo
          echo "========== MAIN.PY: PRODUCTION WORKING TREE VS COMMIT =========="
          sudo -u ubuntu git -C "$REPO" diff HEAD -- backend/main.py
          echo "Working-tree diff exit code: $?"

          echo
          echo "========== MAIN.PY: PRODUCTION WORKING TREE VS GITHUB MAIN =========="
          sudo -u ubuntu git -C "$REPO" diff origin/main -- backend/main.py
          echo "Working-tree comparison exit code: $?"

          echo
          echo "========== CHROMADB CONFIGURATION =========="
          grep -RInE \
            --include='*.py' \
            'PersistentClient|persist_directory|ChromaDB|CHROMA' \
            "$REPO/backend" \
            --exclude-dir=tests \
            --exclude-dir=__pycache__
          echo "ChromaDB search exit code: $?"

          echo
          echo "========== CHECK COMPLETE =========="
          REMOTE
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "========== WAITING FOR REMOTE EXECUTION =========="

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_EXIT_CODE=$?
          set -e

          echo "Waiter exit code: $WAIT_EXIT_CODE"

          echo "========== REMOTE EXECUTION RESULT =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{
              Status:Status,
              StatusDetails:StatusDetails,
              ResponseCode:ResponseCode,
              Output:StandardOutputContent,
              Errors:StandardErrorContent
            }' \
            --output json

