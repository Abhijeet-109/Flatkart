
name: SSM Final Diff Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Inspect production differences
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -euo pipefail
          REPO="/opt/flatkart/source"

          echo "========== MAIN.PY: PRODUCTION VS GITHUB MAIN =========="
          sudo -u ubuntu git -C "$REPO" diff origin/main -- backend/main.py

          echo
          echo "========== MAIN.PY: PRODUCTION VS LOCAL COMMIT =========="
          sudo -u ubuntu git -C "$REPO" diff HEAD -- backend/main.py

          echo
          echo "========== CHROMADB CONFIGURATION =========="
          grep -RInE \
            --include='*.py' \
            'PersistentClient|persist_directory|ChromaDB|CHROMA' \
            "$REPO/backend" \
            --exclude-dir=tests \
            --exclude-dir=__pycache__ || true

          echo
          echo "========== CHECK COMPLETE =========="
          REMOTE
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
