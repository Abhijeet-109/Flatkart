
name: SSM Final Diff Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Inspect production and retrieve diagnostics
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set +e

          REPO="/opt/flatkart/source"

          echo "========== HOST =========="
          hostname
          date -u

          echo
          echo "========== FETCH GITHUB MAIN =========="
          sudo -u ubuntu git -C "$REPO" fetch origin main
          echo "Fetch exit code: $?"

          echo
          echo "========== GIT REFERENCES =========="
          sudo -u ubuntu git -C "$REPO" rev-parse HEAD
          sudo -u ubuntu git -C "$REPO" rev-parse origin/main

          echo
          echo "========== COMMITTED MAIN.PY DIFFERENCE =========="
          sudo -u ubuntu git -C "$REPO" diff HEAD..origin/main -- backend/main.py
          echo "Exit code: $?"

          echo
          echo "========== UNCOMMITTED MAIN.PY DIFFERENCE =========="
          sudo -u ubuntu git -C "$REPO" diff HEAD -- backend/main.py
          echo "Exit code: $?"

          echo
          echo "========== WORKING TREE VS GITHUB MAIN =========="
          sudo -u ubuntu git -C "$REPO" diff origin/main -- backend/main.py
          echo "Exit code: $?"

          echo
          echo "========== CHROMADB REFERENCES =========="
          grep -RInE \
            --include='*.py' \
            'PersistentClient|persist_directory|ChromaDB|CHROMA' \
            "$REPO/backend" \
            --exclude-dir=tests \
            --exclude-dir=__pycache__
          echo "Search exit code: $?"

          echo
          echo "========== REMOTE SCRIPT FINISHED =========="
          exit 0
          REMOTE
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM COMMAND ID: $COMMAND_ID"

          echo "========== WAITING FOR SSM =========="

          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          echo
          echo "========== FINAL SSM RESULT =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true

          echo
          echo "========== DIAGNOSTIC COLLECTION COMPLETE =========="
