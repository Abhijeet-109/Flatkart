
name: SSM Production Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Inspect production without modifying it
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set +e

          echo "========== HOST =========="
          hostname
          date -u

          echo
          echo "========== SOURCE CHECKOUT =========="
          sudo -u ubuntu git -C /opt/flatkart/source rev-parse --short HEAD
          sudo -u ubuntu git -C /opt/flatkart/source status --short --branch

          echo
          echo "========== BACKEND CONTAINER CONFIGURATION =========="
          python3 - <<'PY'
          import json
          import subprocess

          try:
              raw = subprocess.check_output(
                  ["docker", "inspect", "flatkart-backend"],
                  text=True
              )
              c = json.loads(raw)[0]
              cfg = c.get("Config", {})
              host = c.get("HostConfig", {})

              print("Image:", cfg.get("Image"))
              print("Working directory:", cfg.get("WorkingDir"))
              print("Entrypoint:", cfg.get("Entrypoint"))
              print("Command:", cfg.get("Cmd"))
              print("Network mode:", host.get("NetworkMode"))
              print("Restart policy:", host.get("RestartPolicy"))
              print("Published ports:", c.get("NetworkSettings", {}).get("Ports"))
              print("Environment variable NAMES only:")
              for name in sorted(
                  item.split("=", 1)[0]
                  for item in cfg.get("Env", [])
              ):
                  print(" ", name)

              print("Mounts:")
              for mount in c.get("Mounts", []):
                  print(
                      " ",
                      mount.get("Type"),
                      mount.get("Source"),
                      "->",
                      mount.get("Destination"),
                      "RW=",
                      mount.get("RW")
                  )
          except Exception as exc:
              print("Container inspection error:", type(exc).__name__)
          PY

          echo
          echo "========== PERSISTENT DIRECTORY STRUCTURE =========="
          if [ -d /opt/flatkart/persistent ]; then
            find /opt/flatkart/persistent -maxdepth 4 \
              -printf '%y %m %u:%g %s %p\n' 2>/dev/null | head -300
          else
            echo "Persistent directory not found"
          fi

          echo
          echo "========== BACKEND DATA-RELATED PATHS =========="
          docker exec flatkart-backend sh -lc \
            'find /app -maxdepth 6 \( -iname "*upload*" -o -iname "*evidence*" -o -iname "*token*" -o -iname "*oauth*" -o -iname "*manifest*" -o -iname "*data*" \) -print 2>/dev/null | head -250' \
            2>&1

          echo
          echo "========== FRONTEND WEB ROOT =========="
          ls -ld /var/www/flatkart
          readlink -f /var/www/flatkart
          find /var/www/flatkart -maxdepth 2 -type f \
            -printf '%m %u:%g %s %p\n' 2>/dev/null | head -80

          echo
          echo "========== NGINX ROUTING DIRECTIVES =========="
          sudo nginx -T 2>/dev/null |
            grep -E '^# configuration file|^[[:space:]]*(listen|server_name|root|alias|proxy_pass)[[:space:]]' |
            head -160

          echo
          echo "========== ENV FILE METADATA ONLY =========="
          sudo stat -c '%n permissions=%a owner=%U group=%G' \
            /opt/flatkart/backend.env \
            /opt/flatkart/db.env 2>/dev/null

          echo
          echo "========== RUNNING CONTAINERS =========="
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

          echo
          echo "========== DOCKER VOLUMES =========="
          docker volume ls

          echo
          echo "========== INSPECTION COMPLETE =========="
          REMOTE
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
