
name: Flatkart Production Deployment

on:
  workflow_run:
    workflows: ["Flatkart CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatkart-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy Flatkart to EC2 through SSM
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy application
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          INSTANCE_ID="i-01c24733a9b926da9"

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -Eeuo pipefail

          REPO="/opt/flatkart/source"
          TARGET_SHA="__TARGET_SHA__"
          SHORT_SHA="${TARGET_SHA:0:12}"
          RELEASE_DIR="/opt/flatkart/releases/$TARGET_SHA"

          IMAGE_TAG="flatkart-backend:$SHORT_SHA"
          ROLLBACK_IMAGE="flatkart-backend:rollback-$SHORT_SHA"
          ROLLBACK_CONTAINER="flatkart-backend-rollback-$SHORT_SHA"

          WEBROOT="/var/www/flatkart"
          WEB_STAGE="/var/www/flatkart-new-$SHORT_SHA"
          WEB_BACKUP="/var/www/flatkart-rollback-$SHORT_SHA"
          WEB_FAILED="/var/www/flatkart-failed-$SHORT_SHA"

          UPLOADS_HOST="/opt/flatkart/persistent/uploads"
          EVIDENCE_HOST="/opt/flatkart/persistent/private_return_evidence"

          rollback_backend() {
            echo "========== BACKEND ROLLBACK =========="
            docker rm -f flatkart-backend >/dev/null 2>&1 || true

            if docker container inspect "$ROLLBACK_CONTAINER" >/dev/null 2>&1; then
              docker rename "$ROLLBACK_CONTAINER" flatkart-backend
              docker start flatkart-backend

              for attempt in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null; then
                  echo "Previous backend restored successfully."
                  return 0
                fi
                sleep 5
              done
            fi

            echo "CRITICAL: Backend rollback did not become healthy."
            return 1
          }

          rollback_frontend() {
            echo "========== FRONTEND ROLLBACK =========="

            if [ -e "$WEBROOT" ]; then
              mv "$WEBROOT" "$WEB_FAILED" || true
            fi

            if [ -e "$WEB_BACKUP" ]; then
              mv "$WEB_BACKUP" "$WEBROOT"
            fi

            nginx -t && systemctl reload nginx || true
          }

          echo "========== PRE-FLIGHT =========="

          test -d "$REPO"
          test -f /opt/flatkart/backend.env
          test -d "$WEBROOT"
          docker network inspect flatkart-net >/dev/null
          docker inspect flatkart-postgres >/dev/null
          docker inspect flatkart-backend >/dev/null

          curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null
          nginx -t

          # Idempotent cleanup for previous attempts or retries of the same commit
          if docker container inspect "$ROLLBACK_CONTAINER" >/dev/null 2>&1; then
            echo "Cleaning up stale rollback container from previous attempt: $ROLLBACK_CONTAINER"
            docker rm -f "$ROLLBACK_CONTAINER" >/dev/null 2>&1 || true
          fi

          if [ -e "$WEB_STAGE" ] || [ -e "$WEB_FAILED" ] || [ -e "$WEB_BACKUP" ]; then
            echo "Cleaning up stale staging and backup paths from previous attempt..."
            rm -rf "$WEB_STAGE" "$WEB_FAILED" "$WEB_BACKUP"
          fi

          echo "Production services are healthy."

          echo
          echo "========== FETCH SOURCE =========="

          sudo -u ubuntu git -C "$REPO" fetch origin main

          sudo -u ubuntu git -C "$REPO" cat-file -e "$TARGET_SHA^{commit}"

          CURRENT_MAIN=$(sudo -u ubuntu git -C "$REPO" rev-parse origin/main)

          echo "Deployment commit: $TARGET_SHA"
          echo "GitHub main: $CURRENT_MAIN"

          if [ "$CURRENT_MAIN" != "$TARGET_SHA" ]; then
            echo "GitHub main changed after this workflow was dispatched."
            echo "Run the workflow again against the latest main commit."
            exit 1
          fi

          if [ -e "$RELEASE_DIR" ]; then
            echo "Release directory already exists from previous attempt. Cleaning up for fresh deployment..."
            rm -rf "$RELEASE_DIR"
          fi

          install -d -o ubuntu -g ubuntu "$RELEASE_DIR"

          sudo -u ubuntu git -C "$REPO" archive "$TARGET_SHA" \
            | tar -x -C "$RELEASE_DIR"

          chown -R ubuntu:ubuntu "$RELEASE_DIR"

          echo
          echo "========== BUILD FRONTEND =========="

          sudo -u ubuntu bash -lc \
            "cd '$RELEASE_DIR/frontend' && npm install --no-audit --no-fund && npm run build"

          test -s "$RELEASE_DIR/frontend/dist/index.html"

          echo "Frontend build passed."

          echo
          echo "========== BUILD BACKEND =========="

          docker build \
            -f "$RELEASE_DIR/backend/Dockerfile" \
            -t "$IMAGE_TAG" \
            "$RELEASE_DIR"

          echo "Backend image build passed."

          echo
          echo "========== PRESERVE APPLICATION DATA =========="

          install -d "$UPLOADS_HOST" "$EVIDENCE_HOST"

          # Copy the latest files from the running production container.
          docker cp flatkart-backend:/app/backend/uploads/. "$UPLOADS_HOST/"

          # Detect the actual return-evidence directory configured in production.
          EVIDENCE_PATH=$(
            docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' flatkart-backend \
            | sed -n 's/^RETURN_EVIDENCE_DIR=//p' \
            | tail -n 1
          )

          if [ -z "$EVIDENCE_PATH" ]; then
            EVIDENCE_PATH="/app/backend/private_return_evidence"
          fi

          case "$EVIDENCE_PATH" in
            /*) ;;
            *)
              echo "Invalid return-evidence directory. Stop."
              exit 1
              ;;
          esac

          case "$EVIDENCE_PATH" in
            *:*)
              echo "Unsupported return-evidence path. Stop."
              exit 1
              ;;
          esac

          case "$EVIDENCE_PATH" in
            *..*)
              echo "Unsafe return-evidence path. Stop."
              exit 1
              ;;
          esac

          docker exec flatkart-backend mkdir -p "$EVIDENCE_PATH"

          docker cp \
            "flatkart-backend:$EVIDENCE_PATH/." \
            "$EVIDENCE_HOST/"

          echo "Uploads and return-evidence files preserved."

          echo
          echo "========== SAVE ROLLBACK BACKEND =========="

          OLD_IMAGE_ID=$(docker inspect -f '{{.Image}}' flatkart-backend)

          docker tag "$OLD_IMAGE_ID" "$ROLLBACK_IMAGE"

          docker stop flatkart-backend
          docker rename flatkart-backend "$ROLLBACK_CONTAINER"

          echo "Previous backend preserved as $ROLLBACK_CONTAINER."

          echo
          echo "========== START NEW BACKEND =========="

          if ! docker run -d \
            --name flatkart-backend \
            --restart unless-stopped \
            --network flatkart-net \
            -p 127.0.0.1:8000:8000 \
            --env-file /opt/flatkart/backend.env \
            -v "$UPLOADS_HOST:/app/backend/uploads" \
            -v "$EVIDENCE_HOST:$EVIDENCE_PATH" \
            "$IMAGE_TAG"; then

            rollback_backend
            exit 1
          fi

          READY=0

          for attempt in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null; then
              READY=1
              echo "New backend is healthy."
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' flatkart-backend 2>/dev/null || true)" != "true" ]; then
              echo "New backend container exited."
              break
            fi

            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            docker logs --tail 150 flatkart-backend || true
            rollback_backend
            exit 1
          fi

          echo
          echo "========== PUBLISH FRONTEND =========="

          install -d "$WEB_STAGE"

          cp -a "$RELEASE_DIR/frontend/dist/." "$WEB_STAGE/"

          mv "$WEBROOT" "$WEB_BACKUP"

          if ! mv "$WEB_STAGE" "$WEBROOT"; then
            mv "$WEB_BACKUP" "$WEBROOT"
            rollback_backend
            exit 1
          fi

          if ! nginx -t || ! systemctl reload nginx; then
            echo "Frontend/Nginx deployment failed."
            rollback_frontend
            rollback_backend
            exit 1
          fi

          echo
          echo "========== FINAL HEALTH CHECK =========="

          if ! curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null; then
            rollback_frontend
            rollback_backend
            exit 1
          fi

          echo
          echo "========== CLEANUP =========="
          echo "Removing temporary release directory to free disk space..."
          rm -rf "$RELEASE_DIR"
          docker image prune -f >/dev/null 2>&1 || true

          echo
          echo "========== DEPLOYMENT SUCCESSFUL =========="
          echo "Commit: $TARGET_SHA"
          echo "Backend: healthy"
          echo "Frontend: published"
          echo "Uploads: persistent"
          echo "Return evidence: persistent"
          echo "Previous backend: $ROLLBACK_CONTAINER"
          echo "Previous frontend: $WEB_BACKUP"
          echo "PostgreSQL container and volume were not replaced."
          REMOTE
          )

          REMOTE_SCRIPT=$(printf '%s' "$REMOTE_SCRIPT" | sed "s/__TARGET_SHA__/$TARGET_SHA/g")

          # SSM uses /bin/sh by default. Decode and explicitly execute with Bash.
          REMOTE_SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)

          PARAMETERS=$(jq -n \
            --arg command "printf '%s' '$REMOTE_SCRIPT_B64' | base64 -d | bash" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 360); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "SSM attempt $attempt: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json)

          echo "$RESULT" | jq -r \
            '"===== STDOUT =====\\n" + .StandardOutputContent + "\\n===== STDERR =====\\n" + .StandardErrorContent'

          RESPONSE_CODE=$(echo "$RESULT" | jq -r '.ResponseCode')

          if [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" != "0" ]; then
            echo "Production deployment failed. Inspect rollback status above."
            exit 1
          fi
